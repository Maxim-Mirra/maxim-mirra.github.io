<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxim Mirra — Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e0e;
  --bg2: #161616;
  --fg: #e8e4dc;
  --fg2: #888;
  --fg3: #444;
  --accent: #c8b89a;
  --border: #222;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background: linear-gradient(to bottom, rgba(14,14,14,0.95) 0%, transparent 100%);
}

.nav-name {
  font-family: 'Unbounded', sans-serif;
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.02em;
  color: var(--fg);
  text-decoration: none;
}

.lang-toggle { display: flex; gap: 4px; align-items: center; }

.lang-btn {
  background: none;
  border: none;
  color: var(--fg3);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  cursor: pointer;
  padding: 4px 8px;
  transition: color 0.2s;
}
.lang-btn.active { color: var(--fg); }
.lang-btn:hover { color: var(--fg2); }
.lang-sep { color: var(--fg3); font-size: 10px; }

.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 40px 60px;
  position: relative;
}

.hero-photo {
  width: 25%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  object-position: center top;
  display: block;
  margin-bottom: 40px;
  flex-shrink: 0;
}

.hero-label {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--fg3);
  text-transform: uppercase;
  margin-bottom: 16px;
}

.hero-title {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(34px, 5.9vw, 86px);
  font-weight: 300;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--fg);
  margin-bottom: 32px;
}

.hero-desc {
  max-width: 480px;
  color: var(--fg2);
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 36px;
}

.hero-contacts { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }

.contact-link {
  color: var(--fg2);
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 0.05em;
  border-bottom: 0.5px solid var(--fg3);
  padding-bottom: 2px;
  transition: color 0.2s, border-color 0.2s;
}
.contact-link:hover { color: var(--accent); border-color: var(--accent); }

.scroll-line {
  position: absolute;
  bottom: 60px;
  right: 40px;
  width: 0.5px;
  height: 40px;
  background: var(--fg3);
  animation: scrollDown 2s ease-in-out infinite;
}
@keyframes scrollDown {
  0%, 100% { transform: scaleY(1); transform-origin: top; opacity: 0.4; }
  50% { transform: scaleY(0.3); transform-origin: top; opacity: 1; }
}

section {
  padding: 80px 40px;
  border-top: 0.5px solid var(--border);
}

.section-header {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin-bottom: 48px;
}

.section-title {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(16px, 2.5vw, 28px);
  font-weight: 300;
  color: var(--fg);
  letter-spacing: -0.01em;
}

.section-num {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--fg3);
  letter-spacing: 0.15em;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
}

.card {
  position: relative;
  cursor: pointer;
  overflow: hidden;
  background: var(--bg2);
}
.card::before { content: ''; display: block; padding-top: 100%; }

.card-inner {
  position: absolute;
  inset: 0;
  overflow: hidden;
  transition: filter 0.3s;
}
.card:hover .card-inner { filter: brightness(0.55); }

.card-info {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 12px 14px;
  background: linear-gradient(to top, rgba(14,14,14,0.92) 0%, transparent 100%);
}

.card-name {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: var(--fg);
  font-weight: 500;
  line-height: 1.3;
  margin-bottom: 3px;
}

.card-type {
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  color: #ffffff;
  letter-spacing: 0.06em;
}

.play-btn {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
}
.card:hover .play-btn { opacity: 1; transform: translate(-50%, -50%) scale(1); }

.reserve-toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  padding: 24px 0;
  border-top: 0.5px solid var(--border);
  border-bottom: 0.5px solid var(--border);
  user-select: none;
  transition: opacity 0.2s;
}
.reserve-toggle:hover { opacity: 0.7; }

.reserve-toggle-title {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(16px, 2.5vw, 28px);
  font-weight: 300;
  color: var(--fg2);
}

.reserve-toggle-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.3s;
}
.reserve-toggle-icon svg { width: 22px; height: 22px; }
.reserve-toggle.open .reserve-toggle-icon { transform: rotate(180deg); }

.reserve-body { display: none; padding-top: 2px; }
.reserve-body.open { display: block; }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal-box { position: relative; width: 100%; max-width: 900px; }

.modal-close {
  position: absolute;
  top: -40px; right: 0;
  background: none; border: none;
  color: var(--fg2);
  font-size: 24px;
  cursor: pointer;
  padding: 4px 8px;
  transition: color 0.2s;
}
.modal-close:hover { color: var(--fg); }

/* Строка: плеер + кнопки сбоку */
.modal-player-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.modal-video-wrap {
  position: relative;
  padding-top: 56.25%;
  background: #000;
  flex: 1;
}
.modal-video-wrap.vertical {
  padding-top: 0;
  width: 340px;
  height: 604px;
  flex: none;
}
.modal-video-wrap iframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: none;
}

/* Кнопки источника — вертикально справа */
.modal-source-toggle-side {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* Кнопки источника — горизонтально снизу */
.modal-source-toggle-bottom {
  display: flex;
  gap: 2px;
  margin-top: 12px;
}

.source-btn {
  background: none;
  border: 0.5px solid var(--fg3);
  color: var(--fg3);
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  letter-spacing: 0.12em;
  padding: 5px 12px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
}
.source-btn.active {
  color: var(--fg);
  border-color: var(--fg2);
}
.source-btn:hover:not(:disabled) { color: var(--fg2); border-color: var(--fg2); }
.source-btn:disabled { opacity: 0.2; cursor: default; }

.modal-caption {
  margin-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
}
.modal-title {
  font-family: 'Unbounded', sans-serif;
  font-size: 13px;
  font-weight: 300;
  color: var(--fg);
}
.modal-meta {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  color: var(--fg3);
  letter-spacing: 0.08em;
  white-space: nowrap;
}

footer {
  padding: 60px 40px;
  border-top: 0.5px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 24px;
}
.footer-name {
  font-family: 'Unbounded', sans-serif;
  font-size: 18px;
  font-weight: 200;
  color: var(--fg2);
}
.footer-links { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }

.fade-up { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
.fade-up.visible { opacity: 1; transform: none; }

@media (max-width: 800px) {
  nav { padding: 16px 20px; }
  .hero { padding: 0 20px 50px; }
  .scroll-line { right: 20px; }
  section { padding: 60px 20px; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  footer { padding: 40px 20px; }
  .footer-links { align-items: flex-start; }
  .hero-photo { width: 50%; }
  .modal-video-wrap.vertical { width: 220px; height: 391px; }
}
</style>
</head>

<script>

];

  {ru:"Арт-перформанс в резервуаре",en:"Art Performance",meta_ru:"съёмка + монтаж",meta_en:"shoot + edit",vk:"-236688224_456239027",yt:"ro9YNSFBAcA",vertical:false,thumb:"art_performance.jpg"},

var e = 'mxmrgmv' + '@' + 'gmail.com';
var heroEmail = document.getElementById('email-hero');
var footerEmail = document.getElementById('email-footer');
heroEmail.href = 'mailto:' + e;
heroEmail.textContent = e;
footerEmail.href = 'mailto:' + e;
footerEmail.textContent = e;

var lang = 'ru';
var currentItem = null;

var gradients = [
  'linear-gradient(135deg,#1c1a18 0%,#2a2520 100%)',
  'linear-gradient(135deg,#181a1c 0%,#1e2028 100%)',
  'linear-gradient(135deg,#1a1c18 0%,#22201a 100%)',
  'linear-gradient(135deg,#1a181c 0%,#201e24 100%)'
];

function embedUrl(item, source) {
  if (source === 'yt' && item.yt)
    return 'https://www.youtube.com/embed/' + item.yt + '?autoplay=1&rel=0';
  if (source === 'vk' && item.vk) {
    var p = item.vk.split('_');
    return 'https://vkvideo.ru/video_ext.php?oid=' + p[0] + '&id=' + p[1] + '&hd=2&autoplay=1';
  }
  return '';
}

function makeCard(item, idx) {
  var title = item[lang] || item.ru;
  var meta = item['meta_' + lang] || item.meta_ru;
  var bg = gradients[idx % gradients.length];
  var d = encodeURIComponent(JSON.stringify(item));
  var bgStyle = item.thumb
    ? 'background:' + bg + ';background-image:url(' + item.thumb + ');background-size:cover;background-position:center;'
    : 'background:' + bg + ';';
  return '<div class="card" onclick="openModal(\'' + d + '\')">'
    + '<div class="card-inner" style="' + bgStyle + '">'
    + '<div class="play-btn"><svg width="10" height="12" viewBox="0 0 10 12"><path d="M1 1L9 6L1 11V1Z" fill="white"/></svg></div>'
    + '<div class="card-info"><div class="card-name">' + title + '</div><div class="card-type">' + meta + '</div></div>'
    + '</div></div>';
}

function renderGrid(id, items) {
  var el = document.getElementById(id);
  if (!el) return;
  var html = '';
  for (var i = 0; i < items.length; i++) html += makeCard(items[i], i);
  el.innerHTML = html;
}

function renderAll() {
  renderGrid('grid-commercial', commercial);
  renderGrid('grid-auteur', auteur);
  renderGrid('grid-reserve', reserve);
}

function setLang(l) {
  lang = l;
  document.getElementById('btn-ru').classList.toggle('active', l === 'ru');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  var els = document.querySelectorAll('[data-ru]');
  for (var i = 0; i < els.length; i++) els[i].textContent = els[i].getAttribute('data-' + l);
  renderAll();
}

function openModal(d) {
  currentItem = JSON.parse(decodeURIComponent(d));
  var hasBoth = !!(currentItem.yt && currentItem.vk);
  var source = currentItem.yt ? 'yt' : 'vk';

  document.getElementById('modal-title').textContent = currentItem[lang] || currentItem.ru;
  document.getElementById('modal-meta').textContent = currentItem['meta_' + lang] || currentItem.meta_ru;

  var wrap = document.getElementById('modal-video-wrap');
  wrap.className = 'modal-video-wrap' + (currentItem.vertical ? ' vertical' : '');

  var side = document.getElementById('modal-source-toggle-side');
  var bottom = document.getElementById('modal-source-toggle-bottom');

  if (hasBoth && currentItem.vertical) {
    side.style.display = 'flex';
    bottom.style.display = 'none';
  } else if (hasBoth && !currentItem.vertical) {
    side.style.display = 'none';
    bottom.style.display = 'flex';
  } else {
    side.style.display = 'none';
    bottom.style.display = 'none';
  }

  switchSource(source);
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function switchSource(source) {
  var url = embedUrl(currentItem, source);
  if (!url) return;
  document.getElementById('modal-iframe').src = url;

  var ids = ['btn-yt-side', 'btn-vk-side', 'btn-yt-bottom', 'btn-vk-bottom'];
  for (var i = 0; i < ids.length; i++) {
    var btn = document.getElementById(ids[i]);
    var isYt = ids[i].indexOf('yt') !== -1;
    btn.classList.toggle('active', (isYt && source === 'yt') || (!isYt && source === 'vk'));
    btn.disabled = isYt ? !currentItem.yt : !currentItem.vk;
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-iframe').src = '';
  document.body.style.overflow = '';
}

function closeModalOverlay(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

function toggleReserve() {
  document.getElementById('reserve-body').classList.toggle('open');
  document.getElementById('reserve-toggle').classList.toggle('open');
}

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

var obs = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
}, {threshold: 0.1});
document.querySelectorAll('.fade-up').forEach(function(el) { obs.observe(el); });

renderAll();
</script>
</body>
</html>
